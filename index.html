<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAA Digital</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fa;
      text-align: center;
    }

    header {
      background: #4CAF50;
      color: white;
      padding: 15px;
      font-size: 24px;
    }

    .container {
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: 0.2s;
      font-size: 18px;
    }

    .card:hover {
      transform: scale(1.05);
      background: #e8f5e9;
    }

    .urgent {
      background: #ff5252;
      color: white;
      font-weight: bold;
    }

    .custom {
      margin-top: 30px;
    }

    input {
      padding: 10px;
      width: 70%;
      font-size: 16px;
      margin-bottom: 10px;
    }

    button {
      padding: 10px 15px;
      font-size: 16px;
      border: none;
      background: #4CAF50;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #45a049;
    }
  </style>
</head>
<body>

<header>CAA Digital - Comunicação Assistiva</header>

<div class="container">
  <h2>Toque ou passe para ouvir</h2>

  <div class="grid" id="defaultButtons"></div>

  <div class="custom">
    <h3>Frases personalizadas</h3>
    <input type="text" id="customText" placeholder="Digite uma frase">
    <br>
    <button onclick="addPhrase()">Adicionar</button>

    <div class="grid" id="customButtons"></div>
  </div>
</div>

<script>
  let lastSpoken = '';

  function speak(text) {
    if (lastSpoken === text) return; // evita repetição contínua
    lastSpoken = text;

    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = 'pt-BR';

    speech.onend = () => {
      lastSpoken = '';
    };

    window.speechSynthesis.speak(speech);
  }

  function createCard(text, extraClass = '') {
    const div = document.createElement('div');
    div.className = 'card ' + extraClass;
    div.innerText = text;

    // clique
    div.onclick = () => speak(text);

    // passar mouse (desktop)
    div.onmouseenter = () => speak(text);

    // toque leve (mobile)
    div.ontouchstart = () => speak(text);

    return div;
  }

  function loadDefaultButtons() {
    const container = document.getElementById('defaultButtons');

    const frases = [
      { text: 'Olá' },
      { text: 'Estou com fome' },
      { text: 'Estou com sede' },
      { text: 'Quero ir ao banheiro' },
      { text: 'Estou com dor' },
      { text: 'Preciso de ajuda urgente', class: 'urgent' }
    ];

    frases.forEach(f => {
      const card = createCard(f.text, f.class || '');
      container.appendChild(card);
    });
  }

  function addPhrase() {
    const input = document.getElementById('customText');
    const text = input.value.trim();

    if (text === '') return;

    const container = document.getElementById('customButtons');

    const card = createCard(text);
    container.appendChild(card);

    savePhrase(text);
    input.value = '';
  }

  function savePhrase(text) {
    let phrases = JSON.parse(localStorage.getItem('phrases')) || [];
    phrases.push(text);
    localStorage.setItem('phrases', JSON.stringify(phrases));
  }

  function loadPhrases() {
    let phrases = JSON.parse(localStorage.getItem('phrases')) || [];
    const container = document.getElementById('customButtons');

    phrases.forEach(text => {
      const card = createCard(text);
      container.appendChild(card);
    });
  }

  window.onload = () => {
    loadDefaultButtons();
    loadPhrases();
  };
</script>

</body>
</html>
